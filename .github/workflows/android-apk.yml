name: Build Leaf Reader APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/leaf-reader-2.0', 'feature/leaf-reader-2.1', 'feature/leaf-reader-3.0', 'feature/leaf-reader-3.1-stability']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LeafReader-3.1-stability-preview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
